name: Publish Weekly Issue

# 每周一出刊：把上一周的快照聚合成新的一期，提交回仓库，然后重新构建部署。
on:
  schedule:
    # 08:23 Asia/Shanghai，排在当日采集（07:23）之后一小时，确保用上最新一份快照。
    #
    # 分钟数刻意错开整点：GitHub 的 schedule 在高负载时段会直接**丢弃**本次触发
    # 而不是延后补跑，整点（尤其 UTC 午夜）是全平台最挤的槽位。原来的
    # `0 0 * * 1` 第一次该触发时就没跑起来，第 2 期是手动补出来的。
    - cron: '23 0 * * 1'
  workflow_dispatch:
    inputs:
      recent_days:
        description: 改用「最近 N 天」而不是上一个完整自然周（冷启动出第 1 期时填 7）
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 全站唯一调用 DeepL 的地方：只翻本期入选的几十条，翻完固化进 issue JSON，
      # 此后任何重新构建都不会再产生翻译请求。
      - name: Assemble issue
        run: |
          if [ -n "${{ inputs.recent_days }}" ]; then
            pnpm publish-issue --recent "${{ inputs.recent_days }}"
          else
            pnpm publish-issue
          fi
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

      - name: Commit issue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/issues
          if git diff --staged --quiet; then
            echo "No new issue to commit."
            exit 0
          fi

          # 重跑保护。GitHub 的「Re-run all jobs」会用原来那个 SHA 重新检出，
          # 已经推上去的那一期不在这份检出里，于是这里会重算出一份同号、但
          # publishedAt 不同的 JSON（见 assemble-issue.ts 的 `new Date()`），
          # git pull --rebase 必然 add/add 冲突，这个 run 重跑多少次都不可能变绿。
          # 2026-09-21 就卡在这儿：出刊那步其实第一次就成功了，真正挂的是
          # 后面的 deploy-server，重跑反而把现场盖成了一个假的出刊失败。
          # 远端已经有这一期 = 出刊早成功过，丢掉重算的这份，让 deploy 照常跑。
          git fetch origin "$GITHUB_REF_NAME"
          for file in $(git diff --staged --diff-filter=A --name-only); do
            if git cat-file -e "FETCH_HEAD:$file" 2>/dev/null; then
              echo "$file 已在远端发布，本次是重跑，跳过提交。"
              exit 0
            fi
          done

          git commit -m "feat(content): 发布新一期周刊"
          git pull --rebase
          git push

  # 复用部署流水线，避免 Pages + rsync 两套步骤写两遍。
  # deploy.yml 里的 checkout 显式取分支最新提交，能拿到上面刚推的那一期。
  deploy:
    needs: publish
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets: inherit
