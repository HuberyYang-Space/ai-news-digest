name: Deploy

on:
  push:
    branches: [main]
    # content/ 的改动由 collect / publish 自己提交，不需要因此重新部署一次。
    # （GITHUB_TOKEN 推送的 commit 本来就不会触发 workflow，这里是第二道保险。）
    paths-ignore:
      - 'content/**'
  workflow_dispatch:
  # 供 publish.yml 在出刊后调用，避免部署步骤写两份
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 显式取分支最新提交，而不是触发本次运行的那个 SHA——被 publish.yml
          # 调用时，新一期的 commit 是在本次运行开始之后才推上去的，用默认 SHA
          # 会构建出一个不含新期号的站点。
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # 构建只读 content/ 下的本地 JSON，不联网、不调用任何 API
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ./dist
          retention-days: 1

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  deploy-server:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # rsync 走 SSH，对端偶尔会在握手阶段直接掐断（2026-09-21 出过一次：
      # `Connection closed by <host> port 22`、rsync exit 255、0 字节都没传出去，
      # 下一次部署自己就好了）。单次抖动不该把整条流水线判死——尤其它是
      # publish.yml 的下游，红了会诱使人去重跑出刊。ssh-deploy 自己没有重试，
      # 所以这里重复一遍。两个步骤的 with 必须一起改。
      - id: rsync
        continue-on-error: true
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USERNAME }}
          SOURCE: dist/
          TARGET: /www/wwwroot/ai-news-digest/
          ARGS: -rltgoDzvO --delete
          EXCLUDE: .user.ini

      # 立刻重试对「被对端限流」这类原因没用，等一会儿再来。
      - name: Wait before retry
        if: steps.rsync.outcome == 'failure'
        run: sleep 30

      - name: Retry rsync
        if: steps.rsync.outcome == 'failure'
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USERNAME }}
          SOURCE: dist/
          TARGET: /www/wwwroot/ai-news-digest/
          ARGS: -rltgoDzvO --delete
          EXCLUDE: .user.ini
