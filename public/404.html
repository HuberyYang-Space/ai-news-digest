<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面不存在 — AI 周刊</title>
  <link rel="icon" type="image/svg+xml" href="/ai-news-digest/favicon.svg">
  <style>
    :root { --bg: #f5f3f7; --fg: #191520; --muted: #635b6b; --accent: #663399; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #100c14; --fg: #f0edf3; --muted: #988fa3; --accent: #b48af0; }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: var(--bg);
      color: var(--fg);
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    }
    .code {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 { font-size: 1.5rem; margin: 0; }
    p { color: var(--muted); margin: 0; }
    a { color: var(--accent); }
  </style>
</head>

<body>
  <span class="code">404</span>
  <h1>这一页不存在</h1>
  <p><a href="/ai-news-digest/">回到最新一期</a> · <a href="/ai-news-digest/issues/">往期列表</a></p>
</body>

</html>
